# guilty-spark agent stack (remote servers)
# Usage:
#   1. Copy .env.agent.example to .env and set CENTRAL_IP + INSTANCE_NAME
#   2. docker compose -f docker-compose.agent.yml up -d

services:
  dcgm-exporter:
    image: ${DCGM_IMAGE:-nvidia/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04}
    container_name: guilty-spark-dcgm
    profiles: ["gpu"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add:
      - SYS_ADMIN
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_COLLECTORS=/etc/dcgm-exporter/dcgm-metrics.csv
    volumes:
      - ./config/dcgm/dcgm-metrics.csv:/etc/dcgm-exporter/dcgm-metrics.csv:ro
    ports:
      - "9400:9400"
    networks:
      - monitoring

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.11.1}
    container_name: guilty-spark-node
    restart: unless-stopped
    command:
      - '--path.rootfs=/rootfs'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/guilty-spark/textfile:/textfile:ro
    ports:
      - "9100:9100"
    networks:
      - monitoring

  process-exporter:
    image: ${PROCESS_EXPORTER_IMAGE:-ncabatoff/process-exporter:0.8.7}
    container_name: guilty-spark-process-exporter
    restart: unless-stopped
    privileged: true
    command:
      - '--procfs=/host/proc'
      - '--config.path=/config/process-exporter.yml'
    volumes:
      - /proc:/host/proc:ro
      - ./config/process-exporter/process-exporter.yml:/config/process-exporter.yml:ro
    ports:
      - "9256:9256"
    networks:
      - monitoring

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.52.1}
    container_name: guilty-spark-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    networks:
      - monitoring

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.16.1}
    container_name: guilty-spark-alloy
    restart: unless-stopped
    command:
      - run
      - --config.format=promtail
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.yml
    environment:
      - CENTRAL_IP=${CENTRAL_IP}
      - INSTANCE_NAME=${INSTANCE_NAME}
    volumes:
      - ./config/alloy/agent.yml:/etc/alloy/config.yml:ro
      - /var/log:/var/log:ro
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
