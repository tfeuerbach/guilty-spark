# guilty-spark monitoring stack
# Usage: docker compose up -d

services:
  dcgm-exporter:
    image: ${DCGM_IMAGE:-nvidia/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04}
    container_name: guilty-spark-dcgm
    profiles: ["gpu"]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    cap_add:
      - SYS_ADMIN
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_COLLECTORS=/etc/dcgm-exporter/dcgm-metrics.csv
    volumes:
      - ./config/dcgm/dcgm-metrics.csv:/etc/dcgm-exporter/dcgm-metrics.csv:ro
    networks:
      - monitoring
    # Fallback for older Docker: use runtime instead of deploy
    # Uncomment if deploy.reservations doesn't work on your system:
    # runtime: nvidia

  node-exporter:
    image: ${NODE_EXPORTER_IMAGE:-prom/node-exporter:v1.11.1}
    container_name: guilty-spark-node
    restart: unless-stopped
    command:
      - '--path.rootfs=/rootfs'
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/textfile'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /var/lib/guilty-spark/textfile:/textfile:ro
    networks:
      - monitoring

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.11.3}
    container_name: guilty-spark-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitoring
    depends_on:
      - node-exporter

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.2}
    container_name: guilty-spark-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  alloy:
    image: ${ALLOY_IMAGE:-grafana/alloy:v1.16.1}
    container_name: guilty-spark-alloy
    restart: unless-stopped
    command:
      - run
      - --config.format=promtail
      - --server.http.listen-addr=0.0.0.0:9080
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.yml
    environment:
      - INSTANCE_NAME=${INSTANCE_NAME:-local}
    volumes:
      - ./config/alloy/config.yml:/etc/alloy/config.yml:ro
      - /var/log:/var/log:ro
    networks:
      - monitoring
    depends_on:
      - loki

  process-exporter:
    image: ${PROCESS_EXPORTER_IMAGE:-ncabatoff/process-exporter:0.8.7}
    container_name: guilty-spark-process-exporter
    restart: unless-stopped
    privileged: true
    command:
      - '--procfs=/host/proc'
      - '--config.path=/config/process-exporter.yml'
    volumes:
      - /proc:/host/proc:ro
      - ./config/process-exporter/process-exporter.yml:/config/process-exporter.yml:ro
    networks:
      - monitoring

  cadvisor:
    image: ${CADVISOR_IMAGE:-gcr.io/cadvisor/cadvisor:v0.52.1}
    container_name: guilty-spark-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:12.3.6-security-01}
    container_name: guilty-spark-grafana
    restart: unless-stopped
    user: "0:0"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3000
      - GF_INSTALL_PLUGINS=
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/home.json
    entrypoint: ["/bin/sh", "/branding/apply-branding.sh"]
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/branding:/branding:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - monitoring
    depends_on:
      - prometheus
      - loki

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
