apiVersion: 1
groups:
  - orgId: 1
    name: guilty-spark-critical
    folder: Guilty Spark Alerts
    interval: 1m
    rules:
      - uid: gpu-temp-critical
        title: GPU Temperature Critical
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: DCGM_FI_DEV_GPU_TEMP
              refId: A
          - refId: B
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: max
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [90] }
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "GPU temperature exceeds 90°C on {{ $labels.instance }}"
          description: "GPU {{ $labels.gpu }} ({{ $labels.modelName }}) is at {{ $values.B }}°C"
        labels:
          severity: critical

      - uid: disk-usage-critical
        title: Disk Usage Critical (>90%)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) * 100
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [90] }
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Disk usage above 90% on {{ $labels.instance }}"
          description: "Root filesystem is {{ $values.B | printf \"%.1f\" }}% full"
        labels:
          severity: critical

      - uid: memory-critical
        title: Memory Usage Critical (>95%)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [95] }
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: "Memory usage above 95% on {{ $labels.instance }}"
          description: "Available memory critically low at {{ $values.B | printf \"%.1f\" }}% used"
        labels:
          severity: critical

      - uid: node-down
        title: Node Unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="node"}
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: "Node {{ $labels.instance }} is unreachable"
          description: "Prometheus cannot scrape node-exporter — server may be down"
        labels:
          severity: critical

  - orgId: 1
    name: guilty-spark-warning
    folder: Guilty Spark Alerts
    interval: 2m
    rules:
      - uid: disk-usage-warning
        title: Disk Usage Warning (>80%)
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!="tmpfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="tmpfs"}) * 100
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [80] }
              refId: C
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: "Disk usage above 80% on {{ $labels.instance }}"
          description: "Root filesystem at {{ $values.B | printf \"%.1f\" }}% — plan cleanup soon"
        labels:
          severity: warning

      - uid: gpu-idle-allocated
        title: GPU Idle With Memory Allocated
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: DCGM_FI_DEV_FB_USED > 100 and DCGM_FI_DEV_GPU_UTIL == 0
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
        noDataState: OK
        execErrState: OK
        for: 15m
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.instance }} has memory allocated but 0% utilization"
          description: "Possible zombie process holding GPU memory — {{ $labels.modelName }}"
        labels:
          severity: warning

      - uid: high-load
        title: System Load High
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: node_load5 / count without(cpu, mode) (node_cpu_seconds_total{mode="idle"})
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [2] }
              refId: C
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          summary: "High system load on {{ $labels.instance }}"
          description: "5-minute load average is {{ $values.B | printf \"%.2f\" }}x the CPU count"
        labels:
          severity: warning
