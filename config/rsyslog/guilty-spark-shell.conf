# Guilty Spark — Route logs to dedicated files
# Installed to /etc/rsyslog.d/ by setup.sh
# Must be loaded before default rules (00- prefix ensures this).

# Shell history (PROMPT_COMMAND / precmd hooks via local6)
local6.*    /var/log/shell-history.log
& stop

# Snoopy Logger (execve capture — logs via authpriv with "snoopy" tag)
:programname, isequal, "snoopy"    /var/log/snoopy.log
& stop
