# guilty-spark prometheus config
# Targets managed via file_sd_configs (setup.sh + add-agent.sh).
# Auto-reloads every 30s.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'gpu'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/gpu.json'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [agent_name]
        target_label: instance
      - regex: agent_name
        action: labeldrop

  - job_name: 'node'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/node.json'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [agent_name]
        target_label: instance
      - regex: agent_name
        action: labeldrop

  - job_name: 'cadvisor'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/cadvisor.json'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [agent_name]
        target_label: instance
      - regex: agent_name
        action: labeldrop

  - job_name: 'process'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/process.json'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [agent_name]
        target_label: instance
      - regex: agent_name
        action: labeldrop
